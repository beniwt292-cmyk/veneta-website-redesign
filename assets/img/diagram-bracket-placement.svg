<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" role="img" aria-labelledby="t d">
<title id="t">Bracket placement on the headrail</title><desc id="d">Front view of a headrail showing end brackets set in from each end and an evenly spaced centre support, with the maximum unsupported span called out.</desc>
<defs>
  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 z" fill="#8C5A38"/>
  </marker>
  <marker id="ai" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M11 1 L1 6 L11 11 z" fill="#8C5A38"/>
  </marker>
</defs>
<rect width="1400" height="1050" fill="#F6F2EC"/><text x="70" y="92" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#8A8371" text-anchor="start" letter-spacing="3.4">INSTALLATION</text><text x="70" y="158" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="48" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Bracket placement</text><rect x="150" y="380" width="1100" height="86" fill="#211C16" rx="4"/><rect x="164" y="480" width="1072" height="150" fill="#D8C0AC" opacity=".85"/><line x1="164" y1="510" x2="1236" y2="510" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><line x1="164" y1="540" x2="1236" y2="540" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><line x1="164" y1="570" x2="1236" y2="570" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><line x1="164" y1="600" x2="1236" y2="600" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><rect x="210" y="322" width="60" height="58" fill="none" stroke="#8C5A38" stroke-width="4"/><line x1="240" y1="322" x2="240" y2="466" stroke="#8C5A38" stroke-width="2" stroke-dasharray="6 7"/><rect x="670.0" y="322" width="60" height="58" fill="none" stroke="#8C5A38" stroke-width="4"/><line x1="700.0" y1="322" x2="700.0" y2="466" stroke="#8C5A38" stroke-width="2" stroke-dasharray="6 7"/><rect x="1130" y="322" width="60" height="58" fill="none" stroke="#8C5A38" stroke-width="4"/><line x1="1160" y1="322" x2="1160" y2="466" stroke="#8C5A38" stroke-width="2" stroke-dasharray="6 7"/><text x="240" y="304" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="27" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">end</text><text x="700.0" y="304" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="27" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">centre support</text><text x="1160" y="304" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="27" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">end</text><line x1="150" y1="680" x2="240" y2="680" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="195.0" y="718.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">2" in</text><line x1="240" y1="680" x2="700.0" y2="680" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="470.0" y="718.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">max 36"</text><line x1="700.0" y1="680" x2="1160" y2="680" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="930.0" y="718.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">max 36"</text><line x1="1160" y1="680" x2="1250" y2="680" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="1205.0" y="718.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">2" in</text><line x1="150" y1="667.0" x2="150" y2="693.0" stroke="#8C5A38" stroke-width="2"/><line x1="240" y1="667.0" x2="240" y2="693.0" stroke="#8C5A38" stroke-width="2"/><line x1="700.0" y1="667.0" x2="700.0" y2="693.0" stroke="#8C5A38" stroke-width="2"/><line x1="1160" y1="667.0" x2="1160" y2="693.0" stroke="#8C5A38" stroke-width="2"/><line x1="1250" y1="667.0" x2="1250" y2="693.0" stroke="#8C5A38" stroke-width="2"/><line x1="70" y1="800" x2="1330" y2="800" stroke="#DCD5C9" stroke-width="2"/><text x="70" y="860" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">Set end brackets 2" in from each end. Add one support for every 36" of span.</text><text x="70" y="906" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">Level the brackets to each other, not to the sill: old sills are rarely level.</text><text x="70" y="972" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">Pilot-drill hardwood and plaster. Never anchor a headrail into drywall alone.</text></svg>