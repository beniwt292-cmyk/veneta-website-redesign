  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 z" fill="#8C5A38"/>
  </marker>
  <marker id="ai" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M11 1 L1 6 L11 11 z" fill="#8C5A38"/>
  </marker>
</defs>
<rect width="1400" height="1050" fill="#F6F2EC"/><text x="70" y="92" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#8A8371" text-anchor="start" letter-spacing="3.4">MOUNT TYPE 01</text><text x="70" y="158" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="48" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Inside mount</text><rect x="258" y="218" width="544" height="664" fill="#EDE7DD" stroke="#DCD5C9" stroke-width="2"/><rect x="320" y="280" width="420" height="540" fill="#E4EAE6" stroke="#8A8371" stroke-width="2"/><line x1="320" y1="550.0" x2="740" y2="550.0" stroke="#8A8371" stroke-width="6"/><rect x="328" y="288" width="404" height="52" fill="#211C16" rx="3"/><rect x="336" y="340" width="388" height="334.8" fill="#D8C0AC" opacity=".92"/><line x1="336" y1="366" x2="724" y2="366" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="392" x2="724" y2="392" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="417" x2="724" y2="417" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="443" x2="724" y2="443" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="469" x2="724" y2="469" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="495" x2="724" y2="495" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="520" x2="724" y2="520" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="546" x2="724" y2="546" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="572" x2="724" y2="572" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="598" x2="724" y2="598" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="623" x2="724" y2="623" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><line x1="336" y1="649" x2="724" y2="649" stroke="#FCFAF6" stroke-width="1.5" opacity=".65"/><rect x="336" y="675" width="388" height="16" fill="#55503F"/><line x1="320" y1="246" x2="740" y2="246" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="530.0" y="230.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">opening width</text><line x1="320" y1="233.0" x2="320" y2="259.0" stroke="#8C5A38" stroke-width="2"/><line x1="740" y1="233.0" x2="740" y2="259.0" stroke="#8C5A38" stroke-width="2"/><line x1="286" y1="280" x2="286" y2="820" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="270.0" y="558.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="end" letter-spacing="0">opening height</text><line x1="273.0" y1="280" x2="299.0" y2="280" stroke="#8C5A38" stroke-width="2"/><line x1="273.0" y1="820" x2="299.0" y2="820" stroke="#8C5A38" stroke-width="2"/><line x1="70" y1="940" x2="1330" y2="940" stroke="#DCD5C9" stroke-width="2"/><text x="830" y="320" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Shade sits fully</text><text x="830" y="366" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">inside the recess.</text><text x="830" y="410" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">Order the exact</text><text x="830" y="454" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">opening size, to the</text><text x="830" y="498" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">nearest 1/8". The</text><text x="830" y="542" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">factory takes the</text><text x="830" y="586" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">deduction, not you.</text><text x="70" y="990" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">Never subtract from an inside-mount width yourself.</text></svg>