<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" role="img" aria-labelledby="t d">
<title id="t">Inside mount cross-section</title><desc id="d">Cut-away view of a window opening with the shade headrail fitted inside the recess, dimensioned across the opening width and down the opening height.</desc>
