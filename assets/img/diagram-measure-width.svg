<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" role="img" aria-labelledby="t d">
<title id="t">Measuring width in three places</title><desc id="d">A window opening with three horizontal measurements taken at the top, middle and sill, and a note that the narrowest of the three is the one to record.</desc>
<defs>
  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 z" fill="#8C5A38"/>
  </marker>
  <marker id="ai" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M11 1 L1 6 L11 11 z" fill="#8C5A38"/>
  </marker>
</defs>
<rect width="1400" height="1050" fill="#F6F2EC"/><text x="70" y="92" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#8A8371" text-anchor="start" letter-spacing="3.4">STEP 02</text><text x="70" y="158" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="48" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Width, three places</text><rect x="192" y="232" width="556" height="626" fill="#EDE7DD" stroke="#DCD5C9" stroke-width="2"/><rect x="250" y="290" width="440" height="510" fill="#E4EAE6" stroke="#8A8371" stroke-width="2"/><line x1="250" y1="545.0" x2="690" y2="545.0" stroke="#8A8371" stroke-width="6"/><line x1="250" y1="342" x2="690" y2="342" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="470.0" y="326.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">36 1/4"</text><line x1="250" y1="329.0" x2="250" y2="355.0" stroke="#8C5A38" stroke-width="2"/><line x1="690" y1="329.0" x2="690" y2="355.0" stroke="#8C5A38" stroke-width="2"/><line x1="250" y1="499.0" x2="690" y2="499.0" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="470.0" y="483.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">36 1/8"</text><line x1="250" y1="486.0" x2="250" y2="512.0" stroke="#8C5A38" stroke-width="2"/><line x1="690" y1="486.0" x2="690" y2="512.0" stroke="#8C5A38" stroke-width="2"/><line x1="264" y1="744" x2="676" y2="744" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="470.0" y="728.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">36"</text><line x1="264" y1="731.0" x2="264" y2="757.0" stroke="#8C5A38" stroke-width="2"/><line x1="676" y1="731.0" x2="676" y2="757.0" stroke="#8C5A38" stroke-width="2"/><circle cx="470.0" cy="744" r="0" fill="none"/><text x="470.0" y="798" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">narrowest — record this</text><text x="176" y="350" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="500" fill="#8A8371" text-anchor="end" letter-spacing="0">top</text><text x="176" y="507.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="500" fill="#8A8371" text-anchor="end" letter-spacing="0">middle</text><text x="176" y="752" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="500" fill="#8A8371" text-anchor="end" letter-spacing="0">sill</text><line x1="70" y1="940" x2="1330" y2="940" stroke="#DCD5C9" stroke-width="2"/><text x="70" y="990" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">Steel tape only. Record to the nearest 1/8". Never round the width up.</text><text x="830" y="320" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Out of square?</text><text x="830" y="366" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">If the three widths</text><text x="830" y="410" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">differ by more than</text><text x="830" y="454" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">1/2", switch to an</text><text x="830" y="498" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">outside mount.</text></svg>