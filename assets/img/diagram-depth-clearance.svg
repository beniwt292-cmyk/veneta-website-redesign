<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" role="img" aria-labelledby="t d">
<title id="t">Window depth and headrail clearance</title><desc id="d">Plan-view cut-away through a window jamb showing the flat depth available in front of the glass, the headrail sitting within it, and the flush-mount threshold.</desc>
<defs>
  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 z" fill="#8C5A38"/>
  </marker>
  <marker id="ai" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M11 1 L1 6 L11 11 z" fill="#8C5A38"/>
  </marker>
</defs>
<rect width="1400" height="1050" fill="#F6F2EC"/><text x="70" y="92" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#8A8371" text-anchor="start" letter-spacing="3.4">BEFORE YOU CHOOSE</text><text x="70" y="158" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="48" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Depth and clearance</text><rect x="260" y="300" width="820" height="300" fill="#EDE7DD" stroke="#DCD5C9" stroke-width="2"/><rect x="300" y="340" width="740" height="26" fill="#E4EAE6" stroke="#8A8371" stroke-width="2"/><text x="300" y="320" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="27" font-weight="500" fill="#8A8371" text-anchor="start" letter-spacing="0">glass</text><line x1="300" y1="366" x2="300" y2="560" stroke="#8A8371" stroke-width="1.5" stroke-dasharray="6 8"/><line x1="1040" y1="366" x2="1040" y2="560" stroke="#8A8371" stroke-width="1.5" stroke-dasharray="6 8"/><line x1="300" y1="558" x2="1040" y2="558" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="670.0" y="596.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">flat depth available</text><line x1="300" y1="545.0" x2="300" y2="571.0" stroke="#8C5A38" stroke-width="2"/><line x1="1040" y1="545.0" x2="1040" y2="571.0" stroke="#8C5A38" stroke-width="2"/><rect x="350" y="396" width="640" height="86" fill="#211C16" rx="4"/><text x="370" y="450" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="600" fill="#FCFAF6" text-anchor="start" letter-spacing="0">headrail</text><line x1="350" y1="660" x2="990" y2="660" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="670.0" y="698.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">headrail depth</text><line x1="350" y1="647.0" x2="350" y2="673.0" stroke="#8C5A38" stroke-width="2"/><line x1="990" y1="647.0" x2="990" y2="673.0" stroke="#8C5A38" stroke-width="2"/><line x1="350" y1="482" x2="350" y2="660" stroke="#8A8371" stroke-width="1.5" stroke-dasharray="6 8"/><line x1="990" y1="482" x2="990" y2="660" stroke="#8A8371" stroke-width="1.5" stroke-dasharray="6 8"/><line x1="70" y1="780" x2="1330" y2="780" stroke="#DCD5C9" stroke-width="2"/><text x="70" y="840" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="27" font-weight="600" fill="#8C5A38" text-anchor="start" letter-spacing="0">3/4"</text><text x="340" y="840" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">cellular shades</text><text x="70" y="886" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="27" font-weight="600" fill="#8C5A38" text-anchor="start" letter-spacing="0">2"</text><text x="340" y="886" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">roller, solar and faux wood</text><text x="70" y="932" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="27" font-weight="600" fill="#8C5A38" text-anchor="start" letter-spacing="0">2 1/2"</text><text x="340" y="932" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">Roman and sheer shades</text><text x="70" y="978" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="27" font-weight="600" fill="#8C5A38" text-anchor="start" letter-spacing="0">Framed</text><text x="340" y="978" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">shutters mount in their own frame</text><text x="70" y="1024" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="27" font-weight="600" fill="#8C5A38" text-anchor="start" letter-spacing="0">Outside mount</text><text x="340" y="1024" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">use an outside mount instead</text></svg>