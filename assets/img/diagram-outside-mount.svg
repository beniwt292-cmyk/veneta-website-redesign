<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" role="img" aria-labelledby="t d">
<title id="t">Outside mount cross-section</title><desc id="d">Front view of a window with the shade mounted on the wall above and beyond the opening, showing two inches of overlap on each side and three inches above the opening.</desc>
<defs>
  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 z" fill="#8C5A38"/>
  </marker>
  <marker id="ai" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M11 1 L1 6 L11 11 z" fill="#8C5A38"/>
  </marker>
</defs>
<rect width="1400" height="1050" fill="#F6F2EC"/><text x="70" y="92" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#8A8371" text-anchor="start" letter-spacing="3.4">MOUNT TYPE 02</text><text x="70" y="158" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="48" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Outside mount</text><rect x="60" y="220" width="700" height="680" fill="#EDE7DD" opacity=".55"/><rect x="266" y="306" width="508" height="528" fill="#EDE7DD" stroke="#DCD5C9" stroke-width="2"/><rect x="320" y="360" width="400" height="420" fill="#E4EAE6" stroke="#8A8371" stroke-width="2"/><line x1="320" y1="570.0" x2="720" y2="570.0" stroke="#8A8371" stroke-width="6"/><rect x="244" y="244" width="552" height="54" fill="#211C16" rx="3"/><rect x="254" y="298" width="532" height="250" fill="#D8C0AC" opacity=".9"/><line x1="254" y1="329" x2="786" y2="329" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><line x1="254" y1="360" x2="786" y2="360" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><line x1="254" y1="392" x2="786" y2="392" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><line x1="254" y1="423" x2="786" y2="423" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><line x1="254" y1="454" x2="786" y2="454" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><line x1="254" y1="486" x2="786" y2="486" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><line x1="254" y1="517" x2="786" y2="517" stroke="#FCFAF6" stroke-width="1.5" opacity=".6"/><rect x="254" y="548" width="532" height="16" fill="#55503F"/><line x1="320" y1="210" x2="320" y2="780" stroke="#8A8371" stroke-width="1.5" stroke-dasharray="6 8"/><line x1="720" y1="210" x2="720" y2="780" stroke="#8A8371" stroke-width="1.5" stroke-dasharray="6 8"/><line x1="244" y1="876" x2="320" y2="876" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="282.0" y="914.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">2"</text><line x1="720" y1="876" x2="796" y2="876" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="758.0" y="914.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">2"</text><line x1="190" y1="244" x2="190" y2="360" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><text x="174.0" y="310.0" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#8C5A38" text-anchor="end" letter-spacing="0">3" above</text><line x1="70" y1="940" x2="1330" y2="940" stroke="#DCD5C9" stroke-width="2"/><text x="70" y="990" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">Add 4" to width and 3" to height, then centre the brackets on the opening.</text><text x="840" y="320" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Use it when</text><text x="840" y="366" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">depth is under 3/4",</text><text x="840" y="410" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">the opening is out</text><text x="840" y="454" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">of square by more</text><text x="840" y="498" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">than 1/2", or you</text><text x="840" y="542" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">want a taller,</text><text x="840" y="586" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">softer window line.</text></svg>