<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" role="img" aria-labelledby="t d">
<title id="t">Measuring height in three places</title><desc id="d">A window opening with three vertical measurements taken at the left, centre and right, and a note that the longest of the three is the one to record.</desc>
<defs>
  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M1 1 L11 6 L1 11 z" fill="#8C5A38"/>
  </marker>
  <marker id="ai" viewBox="0 0 12 12" refX="2" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M11 1 L1 6 L11 11 z" fill="#8C5A38"/>
  </marker>
</defs>
<rect width="1400" height="1050" fill="#F6F2EC"/><text x="70" y="92" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#8A8371" text-anchor="start" letter-spacing="3.4">STEP 03</text><text x="70" y="158" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="48" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Height, three places</text><rect x="184" y="244" width="532" height="562" fill="#EDE7DD" stroke="#DCD5C9" stroke-width="2"/><rect x="240" y="300" width="420" height="450" fill="#E4EAE6" stroke="#8A8371" stroke-width="2"/><line x1="240" y1="525.0" x2="660" y2="525.0" stroke="#8A8371" stroke-width="6"/><line x1="298" y1="310" x2="298" y2="740" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><line x1="285.0" y1="310" x2="311.0" y2="310" stroke="#8C5A38" stroke-width="2"/><line x1="285.0" y1="740" x2="311.0" y2="740" stroke="#8C5A38" stroke-width="2"/><text x="298" y="222" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">48"</text><text x="298" y="850" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="500" fill="#8A8371" text-anchor="middle" letter-spacing="0">left</text><line x1="450.0" y1="310" x2="450.0" y2="740" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><line x1="437.0" y1="310" x2="463.0" y2="310" stroke="#8C5A38" stroke-width="2"/><line x1="437.0" y1="740" x2="463.0" y2="740" stroke="#8C5A38" stroke-width="2"/><text x="450.0" y="222" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">48 1/8"</text><text x="450.0" y="850" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="500" fill="#8A8371" text-anchor="middle" letter-spacing="0">centre</text><line x1="602" y1="310" x2="602" y2="740" stroke="#8C5A38" stroke-width="2.5" marker-start="url(#ai)" marker-end="url(#a)"/><line x1="589.0" y1="310" x2="615.0" y2="310" stroke="#8C5A38" stroke-width="2"/><line x1="589.0" y1="740" x2="615.0" y2="740" stroke="#8C5A38" stroke-width="2"/><text x="602" y="222" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">48 1/4"</text><text x="602" y="850" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="500" fill="#8A8371" text-anchor="middle" letter-spacing="0">right</text><text x="602" y="888" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="600" fill="#8C5A38" text-anchor="middle" letter-spacing="0">longest</text><line x1="70" y1="940" x2="1330" y2="940" stroke="#DCD5C9" stroke-width="2"/><text x="70" y="990" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="500" fill="#55503F" text-anchor="start" letter-spacing="0">Measure from the top of the opening to the sill. Never round the height down.</text><text x="830" y="320" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="28" font-weight="600" fill="#211C16" text-anchor="start" letter-spacing="0">Longest wins</text><text x="830" y="366" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">Record the longest</text><text x="830" y="410" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">of the three. On a</text><text x="830" y="454" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">sloped sill, measure</text><text x="830" y="498" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">to the highest point</text><text x="830" y="542" font-family="'Inter Tight','Inter',system-ui,sans-serif" font-size="29" font-weight="400" fill="#55503F" text-anchor="start" letter-spacing="0">of the slope.</text></svg>